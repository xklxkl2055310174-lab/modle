[project]
name = "modle-serving"
version = "0.1.0"
description = "小模型推理服务与可复现并发压测"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "numpy>=2,<3", "prometheus-client>=0.21,<1",
  "httpx>=0.28,<1", "psutil>=6,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
bench = ["locust>=2.32,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "py-spy>=0.4,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

